plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    if (parchment_version != "none") {
        parchment {
            minecraftVersion = parchment_minecraft_version == "same" ? minecraft_version : parchment_minecraft_version
            mappingsVersion = parchment_version
        }
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            jvmArgument("-XX:+IgnoreUnrecognizedVMOptions")
            jvmArgument("-XX:+AllowEnhancedClassRedefinition")
            jvmArgument("-Xmx4G")

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    /** Dependencies **/
    implementation("maven.modrinth:gF3BGWvG:3i48dTzz") // async mod

    /** Not Dependencies (if unstable, temporarily disable these mods under) **/
    // QOL
    runtimeOnly("maven.modrinth:jade:yd8FKCmx")      // Jade-1.21.1-NeoForge-15.10.5.jar
    runtimeOnly("maven.modrinth:jei:YAcQ6elZ")       // jei-1.21.1-neoforge-19.27.0.340.jar
    runtimeOnly("maven.modrinth:emi:5sIPA1To")       // emi-1.1.24+1.21.1+neoforge.jar
    runtimeOnly("maven.modrinth:ok-zoomer:AkPuuAgJ") // ok_zoomer-neo-10.0.0-beta.13.jar

    // Optimizations
    implementation("maven.modrinth:vEC2jm6I:pP8zrgTu")
    runtimeOnly("maven.modrinth:sodium:Pb3OXVqC")           // sodium-neoforge-0.6.13+mc1.21.1.jar
    runtimeOnly("maven.modrinth:modernfix:VGmSpV69")        // modernfix-neoforge-5.27.8+mc1.21.1.jar
    runtimeOnly("maven.modrinth:ferrite-core:x7kQWVju")     // ferritecore-7.0.3-neoforge.jar
    runtimeOnly("maven.modrinth:lithium:RXHf27Wv")          // lithium-neoforge-0.15.3+mc1.21.1.jar
    runtimeOnly("maven.modrinth:immediatelyfast:PhxY0iHw")  // ImmediatelyFast-NeoForge-1.6.10+1.21.1.jar
    runtimeOnly("maven.modrinth:badoptimizations:S2qthD5S") // BadOptimizations-2.4.1-1.21.1.jar

    // Creative stuff
    runtimeOnly("maven.modrinth:worldedit:WTAFvuRx") // worldedit-mod-7.3.8.jar
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}